<!-- Trang đối chiếu mái ngói bản đồ minh họa với nhà mô hình. Dùng: chép ảnh bản đồ vào public/__ref4.webp, chép file này vào public/, mở http://localhost:5173/illustration-match.html?d=12&amin=150 rồi lấy window.result (xem tools/illustration_sync.py). -->
<!doctype html><body style="margin:0;background:#222;overflow:hidden"><canvas id=c></canvas><script type=module>
import {warpX,warpZ} from '/src/core/warp.js';
const q=new URLSearchParams(location.search),x0=+q.get('x0')||0,y0=+q.get('y0')||0,S=+q.get('s')||1;
const img=new Image();img.src='/__ref4.webp';await img.decode();
const W=img.width,H=img.height,cv=new OffscreenCanvas(W,H),g0=cv.getContext('2d');g0.drawImage(img,0,0);
const px=g0.getImageData(0,0,W,H).data;
// mái ngói: vàng cam (sáng hoặc bị phủ xám ở khu không mở cửa) + mái xanh lục
const roof=new Uint8Array(W*H);
for(let i=0;i<W*H;i++){const r=px[i*4],g=px[i*4+1],b=px[i*4+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;
 let h=0;if(mx!==mn){if(mx===r)h=60*(((g-b)/(mx-mn))%6);else if(mx===g)h=60*((b-r)/(mx-mn)+2);else h=60*((r-g)/(mx-mn)+4)}if(h<0)h+=360;
 const yellow=h>=30&&h<=52&&s>.45&&mx>90;const green=h>=120&&h<=175&&s>.3&&mx>70&&mx<200;
 roof[i]=yellow?1:green?2:0}
// hình thái học: đóng (lấp sọc ngói) rồi mở bán kính R (bỏ nét tường mảnh vàng)
const R=+q.get('r')||2;
const morph=(src,r,max)=>{const t=new Uint8Array(W*H),o=new Uint8Array(W*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=max?0:1;for(let k=-r;k<=r;k++){const xx=x+k;const w=xx<0||xx>=W?0:src[y*W+xx];if(max?w:!w){v=max?1:0;break}}t[y*W+x]=v}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=max?0:1;for(let k=-r;k<=r;k++){const yy=y+k;const w=yy<0||yy>=H?0:t[yy*W+x];if(max?w:!w){v=max?1:0;break}}o[y*W+x]=v}return o};
const bin=roof.map(v=>v?1:0);
const closed=morph(morph(bin,1,true),1,false);
const m=morph(morph(closed,R,false),R,true);

const d=await (await fetch('/data/forbidden-city.json')).json();
const toPx=(x,z)=>[583+warpX(x)/.683,216+(warpZ(z)+480.5)/.6711];
const inv=(f,v)=>{let a=-2000,b=2000;for(let i=0;i<60;i++){const mid=(a+b)/2;if(f(mid)<v)a=mid;else b=mid}return (a+b)/2};
const fromPx=(px,py)=>[inv(warpX,(px-583)*.683),inv(warpZ,(py-216)*.6711-480.5)];
const pip=(x,z,p)=>{let o=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [a,b]=p[i],[c,e]=p[j];if((b>z)!==(e>z)&&x<(c-a)*(z-b)/(e-b)+a)o=!o}return o};
const sites=Object.values(d.sites).map(v=>v[1]);
const all=[...d.buildings,...(d.osmAdditions?.buildings||[])];
// mặt nạ nhà mô hình (pixel ảnh), nở D px
const D=+q.get('d')||4,B=new Uint8Array(W*H);
const res=[];
for(const b of all){
 const P=b[0].map(([x,z])=>toPx(x,z));let xa=1e9,xb=-1e9,ya=1e9,yb=-1e9;for(const [x,y] of P){xa=Math.min(xa,x);xb=Math.max(xb,x);ya=Math.min(ya,y);yb=Math.max(yb,y)}
 let hit=0,tot=0;
 for(let y=Math.floor(ya-D);y<=yb+D;y++)for(let x=Math.floor(xa-D);x<=xb+D;x++){if(x<0||y<0||x>=W||y>=H)continue;
  const inside=pip(x,y,P)||(x>=xa-D&&x<=xb+D&&y>=ya-D&&y<=yb+D&&(pip(x+D,y,P)||pip(x-D,y,P)||pip(x,y+D,P)||pip(x,y-D,P)));
  if(!inside)continue;tot++;B[y*W+x]=1;if(m[y*W+x])hit++}
 res.push({id:b[3],hit,tot,frac:tot?hit/tot:0,px:[(xa+xb)/2,(ya+yb)/2]});
}
// vùng mái chưa có nhà
const U=new Uint8Array(W*H);for(let i=0;i<W*H;i++)U[i]=m[i]&&!B[i]?1:0;
const lab=new Int32Array(W*H),add=[];let n=0;
for(let i=0;i<W*H;i++){if(!U[i]||lab[i])continue;n++;const st=[i];lab[i]=n;let a=0,xa=1e9,xb=-1,ya=1e9,yb=-1;
 while(st.length){const c=st.pop(),x=c%W,y=(c-x)/W;a++;xa=Math.min(xa,x);xb=Math.max(xb,x);ya=Math.min(ya,y);yb=Math.max(yb,y);
  for(const e of [c-1,c+1,c-W,c+W])if(e>=0&&e<W*H&&U[e]&&!lab[e]){lab[e]=n;st.push(e)}}
 if(a>=+(q.get('amin')||60)&&(xb-xa)>=5&&(yb-ya)>=5)add.push({px:[xa,ya,xb,yb],a})}
window.result={res,add,fromPx};
const c=document.getElementById('c');c.width=innerWidth;c.height=innerHeight;const g=c.getContext('2d');
g.drawImage(img,x0,y0,innerWidth/S,innerHeight/S,0,0,innerWidth,innerHeight);
g.lineWidth=2;
for(const r of res){const [x,y]=r.px;g.fillStyle=r.hit===0?'#f00':r.frac<.08?'#fa0':'#0c0';g.beginPath();g.arc((x-x0)*S,(y-y0)*S,4,0,7);g.fill()}
g.strokeStyle='#f0f';for(const k of add){const [a,b,c2,e]=k.px;g.strokeRect((a-x0)*S,(b-y0)*S,(c2-a+1)*S,(e-b+1)*S)}
document.title='none '+res.filter(r=>r.hit===0).length+' add '+add.length;
</script>
